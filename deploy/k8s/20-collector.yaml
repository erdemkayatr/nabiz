apiVersion: v1
kind: Service
metadata:
  name: nabiz-collector
  namespace: nabiz
spec:
  selector:
    app.kubernetes.io/name: nabiz-collector
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: stats,     port: 8888, targetPort: 8888 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nabiz-collector
  namespace: nabiz
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nabiz-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nabiz-collector
    spec:
      containers:
        - name: collector
          image: nabiz/collector:dev
          args: []
          env:
            - { name: NABIZ_CLICKHOUSE_ADDRS,   value: "nabiz-clickhouse.nabiz.svc:9000" }
            - { name: NABIZ_CLICKHOUSE_DATABASE, value: "nabiz" }
            - { name: NABIZ_RETENTION_DAYS,     value: "7" }
            - { name: NABIZ_WORKERS,            value: "4" }
            - { name: NABIZ_BATCH_SIZE,         value: "5000" }
                        # Turning on the node dimension makes node-to-node traffic visible
                        # but multiplies edge cardinality by the number of nodes.
            - { name: NABIZ_TOPOLOGY_INCLUDE_NODE, value: "false" }
          ports:
            - { containerPort: 4317 }
            - { containerPort: 4318 }
            - { containerPort: 8888 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8888 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8888 }
            periodSeconds: 20
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits:   { cpu: "2",  memory: 2Gi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nabiz-collector
  namespace: nabiz
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nabiz-collector
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
