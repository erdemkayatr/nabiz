# nabiz-operator: automatically injects instrumentation into .NET pods.
#
# Usage: a single annotation on the application's pod template:
#   metadata:
#     annotations:
#       nabiz.io/inject-dotnet: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nabiz-operator
  namespace: nabiz
---
# All the operator needs is to write the CA it generates at startup into its own
# webhook configuration. It has NO pod read/write permission: injection happens
# at admission, so there is no need to edit pods afterwards.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nabiz-operator
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    resourceNames: ["nabiz-dotnet-injector"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nabiz-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nabiz-operator
subjects:
  - kind: ServiceAccount
    name: nabiz-operator
    namespace: nabiz
---
apiVersion: v1
kind: Service
metadata:
  name: nabiz-operator
  namespace: nabiz
spec:
  selector:
    app.kubernetes.io/name: nabiz-operator
  ports:
    - { name: webhook, port: 443, targetPort: 9443 }
    - { name: stats,   port: 8888, targetPort: 8888 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nabiz-operator
  namespace: nabiz
spec:
    # One replica: each replica would generate its own CA and write it to the
    # caBundle, so two replicas overwrite each other's certificate. High
    # availability would require sharing the certificate through a Secret.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nabiz-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nabiz-operator
    spec:
      serviceAccountName: nabiz-operator
      containers:
        - name: operator
          image: nabiz/operator:dev
          env:
            - { name: NABIZ_NAMESPACE,             value: "nabiz" }
            - { name: NABIZ_WEBHOOK_SERVICE,       value: "nabiz-operator" }
            - { name: NABIZ_WEBHOOK_CONFIG,        value: "nabiz-dotnet-injector" }
            - { name: NABIZ_COLLECTOR_ENDPOINT,    value: "http://nabiz-collector.nabiz.svc:4317" }
            - { name: NABIZ_INSTRUMENTATION_IMAGE, value: "nabiz/dotnet-instrumentation:1.16.0" }
            - { name: NABIZ_CLUSTER_NAME,          value: "" }
                        # Sampling happens in the agent: a dropped span is never serialized.
            - { name: NABIZ_DEFAULT_SAMPLE_RATIO,  value: "1.0" }
          ports:
            - { name: webhook, containerPort: 9443 }
            - { name: stats,   containerPort: 8888 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8888 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: nabiz-dotnet-injector
webhooks:
  - name: dotnet.nabiz.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
        # If the webhook is unreachable, the pod is still created. An observability
        # tool cannot stop the application from coming up.
    failurePolicy: Ignore
    timeoutSeconds: 5
    reinvocationPolicy: Never
    clientConfig:
      service:
        name: nabiz-operator
        namespace: nabiz
        path: /mutate
        port: 443
            # The caBundle is filled in by the operator at startup.
      caBundle: ""
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        scope: "Namespaced"
        # Keep nabiz's own components out of injection.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["nabiz", "kube-system"]
    objectSelector:
      matchExpressions:
        - key: nabiz.io/injected
          operator: DoesNotExist
