# Example: the single annotation that is all it takes to be instrumented.
# The application image, its Dockerfile and its code are unchanged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-backend
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels: { app: sample-backend }
  template:
    metadata:
      labels: { app: sample-backend }
      annotations:
        nabiz.io/inject-dotnet: "true"
        nabiz.io/service-name: "sample-backend"
                # On Alpine-based images: nabiz.io/libc: "musl"
                # On high-volume services: nabiz.io/sample-ratio: "0.1"
    spec:
      containers:
        - name: app
          image: nabiz-backend:latest
          ports: [{ containerPort: 8080 }]
          env:
            - name: ConnectionStrings__Orders
              value: "Host=postgres;Username=nabiz;Password=nabiz;Database=orders"
