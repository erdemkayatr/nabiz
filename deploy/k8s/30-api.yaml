apiVersion: v1
kind: Service
metadata:
  name: nabiz-api
  namespace: nabiz
spec:
  selector:
    app.kubernetes.io/name: nabiz-api
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nabiz-api
  namespace: nabiz
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nabiz-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nabiz-api
    spec:
            # Create the dump directory volume with this group, so the container can
      securityContext:
        fsGroup: 10001
      volumes:
        - name: dumps
          emptyDir:
            sizeLimit: 20Gi
      containers:
        - name: api
          image: nabiz/api:dev
          env:
            - { name: NABIZ_CLICKHOUSE_ADDRS,    value: "nabiz-clickhouse.nabiz.svc:9000" }
            - { name: NABIZ_CLICKHOUSE_DATABASE, value: "nabiz" }
                        # Control plane. The password comes from a Secret, never baked into the DSN.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: nabiz-postgres, key: POSTGRES_PASSWORD }
            - name: NABIZ_POSTGRES_DSN
              value: "postgres://nabiz:$(PGPASSWORD)@nabiz-postgres.nabiz.svc:5432/nabiz?sslmode=disable"
            # NABIZ_ADMIN_EMAIL / NABIZ_ADMIN_PASSWORD bilerek verilmiyor.
                        # At first startup nabiz generates a random password and writes it
            # yazar: "kubectl logs deploy/nabiz-api | grep parola"
            - { name: NABIZ_ADMIN_EMAIL, value: "admin@nabiz.local" }
                        # The key that encrypts diagnostics tokens. You create this Secret;
                        # if the key changes, stored tokens can no longer be decrypted.
            - name: NABIZ_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: nabiz-secret-key, key: key, optional: true }
            - { name: NABIZ_DUMP_DIR, value: "/var/lib/nabiz/dumps" }
            # Keep this consistent with the emptyDir sizeLimit: if the disk
            # fills before the quota is reached, the pod is evicted instead.
            - { name: NABIZ_DUMP_QUOTA_GB, value: "15" }
            - { name: NABIZ_DUMP_RETENTION_DAYS, value: "7" }
          ports:
            - { containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          volumeMounts:
            - { name: dumps, mountPath: /var/lib/nabiz/dumps }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 1Gi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
